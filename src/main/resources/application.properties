spring.application.name=LoadBalancer

# --- Database Connection Settings ---

spring.datasource.url=jdbc:postgresql://localhost:5432/dispatch
spring.datasource.username=archanbanerjee
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate & JPA Settings ---

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' will create tables based on your Entity classes automatically

spring.jpa.hibernate.ddl-auto=update

# Enable this to see the PostGIS SQL queries in your console during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Connection Pool Settings (Hikari) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000